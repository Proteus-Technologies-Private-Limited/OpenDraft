name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Manual re-run for an existing tag. Without this, a single failed platform
  # job could only be retried by deleting and re-pushing the tag, which rebuilds
  # all nine platforms — including the slow macOS notarization — instead of the
  # one that failed. (Learned the hard way during the Actions outage that broke
  # the v0.21.0 build.)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild, e.g. v0.21.0'
        required: true
        type: string

permissions:
  contents: write
  actions: write
  pull-requests: write
  packages: write

env:
  # The tag being released. A tag push supplies it through github.ref_name; a
  # manual re-run supplies it explicitly. Every job reads this rather than
  # github.ref_name, which on a manual run is the branch the workflow was
  # dispatched from, not the tag.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          # Pinned to macos-15 for the same reason as build-mac-appstore:
          # codesign/notarize hangs on macos-26 until the step times out. In
          # v0.20.0 all three notarizing macOS jobs burned 60 minutes and
          # retried for 60 more, while the macos-15 App Store job finished in
          # under five. Revisit when the macos-26 codesign issue is fixed.
          - platform: macos-15
            target: aarch64-apple-darwin
            label: macOS-arm64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # A manual re-run is dispatched from a branch, so the tag has to
          # be checked out explicitly or we would build the wrong commit.
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_BASE: http://localhost:18321/api

      - name: Import Windows signing certificate
        if: matrix.platform == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "No signing certificate configured - build will be unsigned"
            exit 0
          }
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          Write-Host "Certificate imported with thumbprint: $($cert.Thumbprint)"
          "CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Remove-Item $certPath -Force

      - name: Import Apple Developer certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured — build will be unsigned"
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          # A keychain locks itself again after five minutes of inactivity.
          # The arm64 build compiles for longer than that, so codesign reached
          # a re-locked keychain and blocked forever waiting for an unlock no
          # headless runner can answer: the job hit its 90-minute timeout with
          # codesign still running, and every retry did the same. The jobs that
          # signed within five minutes were unaffected, which is why only this
          # one failed. Six hours is longer than any build here.
          security set-keychain-settings -lut 21600 build.keychain
          security import $RUNNER_TEMP/certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm $RUNNER_TEMP/certificate.p12
          echo "Apple Developer certificate imported"

      - name: Patch tauri.conf.json for CI
        shell: bash
        run: |
          cd src-tauri
          node -e "
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('tauri.conf.json', 'utf8'));
          cfg.build.beforeBuildCommand = '';
          cfg.build.beforeDevCommand = '';
          // Windows code signing if certificate is available
          const thumbprint = process.env.CERTIFICATE_THUMBPRINT || '';
          if (thumbprint) {
            cfg.bundle.windows = cfg.bundle.windows || {};
            cfg.bundle.windows.certificateThumbprint = thumbprint;
            cfg.bundle.windows.timestampUrl = 'http://timestamp.digicert.com';
            cfg.bundle.windows.digestAlgorithm = 'sha256';
            console.log('Windows code signing configured with thumbprint: ' + thumbprint.substring(0, 8) + '...');
          }
          fs.writeFileSync('tauri.conf.json', JSON.stringify(cfg, null, 2));
          "

      - name: Get version number
        id: get_version
        run: echo "VERSION=${RELEASE_TAG#v}" >> $GITHUB_OUTPUT

      # Notarization is the slowest, most fragile part of the macOS build, and
      # it runs at the very END of it. When Apple rejects the request — an
      # expired Program License Agreement is the usual reason — the build has
      # already spent ten minutes compiling, and the failure arrives as an
      # opaque 403. Worse, the same condition sometimes makes notarytool hang
      # instead of erroring, burning the full step timeout twice (once here,
      # once in the retry). Asking notarytool a trivial question first turns all
      # of that into a ten-second failure with an actionable message.
      - name: Verify Apple notarization access
        if: runner.os == 'macOS'
        timeout-minutes: 5
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: .github/scripts/check-notarization-access.sh

      - name: Build Tauri app
        id: tauri_build
        if: runner.os != 'macOS'
        timeout-minutes: 90
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing & notarization (ignored on other platforms)
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          tauriScript: npx --prefix frontend tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'OpenDraft ${{ env.RELEASE_TAG }}'
          releaseBody: |
            ## OpenDraft ${{ env.RELEASE_TAG }}

            A free, open-source screenwriting application. Professional screenplay editing with real-time collaboration — no subscription required.

            ### Download for your platform

            | Platform | File |
            |----------|------|
            | **macOS** (Apple Silicon) | `OpenDraft_${{ steps.get_version.outputs.VERSION }}_aarch64.dmg` |
            | **Windows** (64-bit) | `OpenDraft_${{ steps.get_version.outputs.VERSION }}_x64-setup.exe` or `.msi` |
            | **Linux** (Debian/Ubuntu) | `OpenDraft_${{ steps.get_version.outputs.VERSION }}_amd64.deb` |
            | **Linux** (AppImage) | `OpenDraft_${{ steps.get_version.outputs.VERSION }}_amd64.AppImage` |
            | **Android** (APK) | `OpenDraft_${{ steps.get_version.outputs.VERSION }}_android.apk` |
            | **iOS** (IPA) | `OpenDraft_${{ steps.get_version.outputs.VERSION }}_ios.ipa` |

            ### Installation

            **macOS:** Open the `.dmg`, drag OpenDraft to Applications, double-click to launch.

            > First launch: Right-click the app, select Open, click Open in the dialog. You only need to do this once.

            **Windows:** Run the `.msi` or `.exe` installer, follow the prompts.
            **Linux:** Install the `.deb` with `sudo dpkg -i OpenDraft_*.deb` or run the `.AppImage` directly.
            **Android:** Download the `.apk` file on your device, enable "Install from unknown sources" if prompted, and install.
            **iOS:** Available on the App Store (search "OpenDraft"), or sideload the `.ipa` via Finder/iTunes.

            > The desktop app is fully standalone — no Python, Node.js, or internet connection required after installation.

            ---

            ### Run in browser (self-hosted)

            ```
            git clone https://github.com/Proteus-Technologies-Private-Limited/OpenDraft.git
            cd OpenDraft
            ./setup.sh
            ```

            See [INSTALLATION.md](https://github.com/Proteus-Technologies-Private-Limited/OpenDraft/blob/main/docs/INSTALLATION.md) for details.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      - name: Build Tauri app (retry)
        if: steps.tauri_build.outcome == 'failure' && runner.os != 'macOS'
        timeout-minutes: 90
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx --prefix frontend tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'OpenDraft ${{ env.RELEASE_TAG }}'
          releaseBody: ''
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      # macOS calls the Tauri CLI directly instead of going through
      # tauri-action. In v0.20.0 both tauri-action macOS jobs hung inside
      # codesign until the step timed out — twice each, on two different runner
      # images — while every macOS job that runs the CLI from a plain `run:`
      # step (Intel Legacy, App Store) signed and notarized in 3-6 minutes.
      # Same certificate, same keychain setup, same signing identity: the
      # action was the only difference. The runner had to kill the orphaned
      # codesign processes at job cleanup, which is also why the retry never
      # helped — the orphan still held the keychain.
      - name: Build Tauri app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 90
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: npx --prefix frontend tauri build

      - name: Stage macOS DMG
        if: runner.os == 'macOS'
        run: |
          VERSION="${RELEASE_TAG#v}"
          DMG=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG produced for ${{ matrix.target }}"
            exit 1
          fi
          mkdir -p mac-artifacts
          cp "$DMG" "mac-artifacts/OpenDraft_${VERSION}_aarch64.dmg"
          ls -la mac-artifacts/

      - name: Upload macOS DMG to release
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: mac-artifacts/*
          draft: true

  build-android:
    runs-on: ubuntu-latest
    name: Build (Android)

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # A manual re-run is dispatched from a branch, so the tag has to
          # be checked out explicitly or we would build the wrong commit.
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # API 36 because that is what the Tauri 2.11 template sets for
          # compileSdk and targetSdk in the build.gradle.kts it generates below.
          # Installing an older platform here left the build depending on
          # whatever the runner image happened to ship, or on Gradle's SDK
          # auto-download — neither of which is something to discover during a
          # release. Keep this in step when the Tauri CLI is bumped.
          sdkmanager --install "ndk;27.0.12077973" "build-tools;36.0.0" "platforms;android-36"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Keep what compiled before a failure. Without this the cache is dropped,
          # so every retry restarts cold and re-hits whatever limit it just missed.
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Setup root package.json for Gradle build
        run: |
          echo '{"private":true,"scripts":{"tauri":"tauri"}}' > package.json
          ln -s frontend/node_modules node_modules

      - name: Initialize Android project
        run: npx --prefix frontend tauri android init

      - name: Copy Android icons
        run: |
          RES_DIR="src-tauri/gen/android/app/src/main/res"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES_DIR/mipmap-$density"
            cp images/android-icons/mipmap-$density/* "$RES_DIR/mipmap-$density/"
          done
          # Adaptive icon XML (Android 8+)
          mkdir -p "$RES_DIR/mipmap-anydpi-v26"
          cp images/android-icons/mipmap-anydpi-v26/* "$RES_DIR/mipmap-anydpi-v26/"
          # Background color for adaptive icon
          cp images/android-icons/values/ic_launcher_background.xml "$RES_DIR/values/"

      - name: Copy custom Android sources
        run: |
          # Replace the generated MainActivity with our custom one (adds onNewIntent + onActivityResult)
          MAIN_ACT="src-tauri/gen/android/app/src/main/java/com/proteus/opendraft/MainActivity.kt"
          cp src-tauri/android-src/MainActivity.kt "$MAIN_ACT"
          echo "Custom MainActivity.kt copied"

          # Extra activities, one per additional window (issue #63). Started by
          # name from Rust, so they must also be declared in the manifest below.
          JAVA_DIR="src-tauri/gen/android/app/src/main/java/com/proteus/opendraft"
          cp src-tauri/android-src/WindowActivities.kt "$JAVA_DIR/WindowActivities.kt"
          echo "WindowActivities.kt copied"

          # Create file_paths.xml for FileProvider (needed for export share intent)
          XML_DIR="src-tauri/gen/android/app/src/main/res/xml"
          mkdir -p "$XML_DIR"
          cp src-tauri/android-src/file_paths.xml "$XML_DIR/file_paths.xml"
          echo "file_paths.xml copied to $XML_DIR"

          # ProGuard keep rules for JNI-called classes (R8 can't trace JNI reflection)
          cp src-tauri/android-src/jni-keep-rules.pro src-tauri/gen/android/app/jni-keep-rules.pro
          echo "JNI ProGuard rules copied"

      - name: Add file association intent-filters to AndroidManifest.xml
        run: |
          python3 << 'PYEOF'
          # Tauri already generates launchMode="singleTask" and FileProvider.
          # We only need to add intent-filters for file association.
          #
          # Every failure below exits non-zero. These patches key off the shape
          # of a manifest the Tauri CLI generates, so a CLI upgrade can stop
          # them matching — and the build would otherwise sail on and publish an
          # app that silently cannot open files or open a second window.
          import sys

          manifest_path = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          with open(manifest_path) as f:
              content = f.read()

          intent_filters = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="file" />
                      <data android:scheme="content" />
                      <data android:mimeType="*/*" />
                      <data android:pathPattern=".*\\\\.fdx" />
                      <data android:pathPattern=".*\\\\.fountain" />
                      <data android:pathPattern=".*\\\\.odraft" />
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="file" />
                      <data android:scheme="content" />
                      <data android:mimeType="application/xml" />
                      <data android:host="*" />
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="file" />
                      <data android:scheme="content" />
                      <data android:mimeType="text/plain" />
                      <data android:host="*" />
                  </intent-filter>"""

          if "</activity>" not in content:
              sys.exit(
                  "::error::No </activity> in the generated AndroidManifest.xml — "
                  "file associations cannot be declared. The Tauri template has "
                  "changed shape; update this patch."
              )
          content = content.replace("</activity>", intent_filters + "\n            </activity>", 1)
          print("Android manifest patched with file association intent-filters")

          # ── Extra windows (issue #63) ────────────────────────────────────
          # One <activity> per class in android-src/WindowActivities.kt. Their
          # attributes are cloned from MainActivity rather than written out
          # here, so they keep whatever configChanges and theme Tauri's template
          # declares — a configChanges mismatch would have Android recreate the
          # activity on rotation and throw the WebView away with it.
          import re

          main_activity = re.search(
              r'<activity\b([^>]*?android:name="\.MainActivity"[^>]*?)>', content
          )
          if not main_activity:
              sys.exit(
                  "::error::MainActivity not found in the generated "
                  "AndroidManifest.xml — the extra window activities cannot be "
                  "declared, and File > New Window would fail on every device. "
                  "The Tauri template has changed shape; update this patch."
              )
          else:
              attrs = main_activity.group(1)
              # Everything that has to differ per window, or that only the
              # launcher activity should carry.
              for key in ("name", "launchMode", "exported", "documentLaunchMode",
                          "resizeableActivity", "taskAffinity"):
                  attrs = re.sub(r'\s*android:%s="[^"]*"' % key, "", attrs)
              attrs = attrs.rstrip()

              extra = ""
              for n in (1, 2, 3):
                  # documentLaunchMode="always" is what makes the window its own
                  # entry in Recents; without it the activity lands on top of the
                  # first one in the same task and cannot be tiled beside it.
                  # taskAffinity is cleared for the same reason.
                  extra += (
                      '\n        <activity%s\n'
                      '            android:name=".WindowActivity%d"\n'
                      '            android:exported="false"\n'
                      '            android:taskAffinity=""\n'
                      '            android:resizeableActivity="true"\n'
                      '            android:documentLaunchMode="always" />' % (attrs, n)
                  )

              if "</application>" not in content:
                  sys.exit(
                      "::error::No </application> in the generated "
                      "AndroidManifest.xml — the extra window activities cannot "
                      "be declared. The Tauri template has changed shape; update "
                      "this patch."
                  )
              content = content.replace("</application>", extra + "\n    </application>", 1)
              print("Android manifest patched with 3 extra window activities")

          with open(manifest_path, "w") as f:
              f.write(content)

          # Read back what was written rather than trusting the replaces above.
          written = open(manifest_path).read()
          missing = [n for n in (1, 2, 3) if 'android:name=".WindowActivity%d"' % n not in written]
          if missing:
              sys.exit(
                  "::error::WindowActivity%s missing from the patched manifest."
                  % ", ".join(str(n) for n in missing)
              )
          print("Verified: WindowActivity1-3 declared in the source manifest")
          PYEOF

      - name: Patch tauri.conf.json for Android CI
        run: |
          cd src-tauri
          python3 -c "
          import json
          with open('tauri.conf.json') as f:
              cfg = json.load(f)
          cfg['build']['beforeBuildCommand'] = ''
          cfg['build']['beforeDevCommand'] = ''
          cfg['bundle'].pop('externalBin', None)
          with open('tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2)
          "

      - name: Setup signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.keystore
            echo "Using release keystore from secrets"
          else
            echo "No release keystore — generating temporary keystore for signing"
            keytool -genkey -v \
              -keystore $RUNNER_TEMP/release.keystore \
              -alias opendraft \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OpenDraft, O=OpenDraft" \
              -storepass opendraft -keypass opendraft
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Use secrets if available, otherwise use temp keystore defaults
          KS_PASSWORD="${ANDROID_KEYSTORE_PASSWORD:-opendraft}"
          KS_ALIAS="${ANDROID_KEY_ALIAS:-opendraft}"
          KS_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-opendraft}"

          echo "KEYSTORE_PASSWORD=$KS_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KS_KEY_PASSWORD" >> $GITHUB_ENV

          python3 << 'PYEOF'
          path = 'src-tauri/gen/android/app/build.gradle.kts'
          with open(path) as f:
              content = f.read()

          signing = '''    signingConfigs {
              create("release") {
                  storeFile = file(System.getenv("KEYSTORE_PATH") ?: "/dev/null")
                  storePassword = System.getenv("KEYSTORE_PASSWORD") ?: ""
                  keyAlias = System.getenv("KEY_ALIAS") ?: ""
                  keyPassword = System.getenv("KEY_PASSWORD") ?: ""
              }
          }
          '''
          content = content.replace('    buildTypes {', signing + '    buildTypes {')
          content = content.replace(
              'getByName("release") {',
              'getByName("release") {\n            signingConfig = signingConfigs.getByName("release")',
              1
          )

          with open(path, 'w') as f:
              f.write(content)
          print("Gradle signing config applied")
          PYEOF

      - name: Build Android APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: npx --prefix frontend tauri android build --apk

      # The source manifest is checked above, but the artifact is what ships:
      # the Tauri CLI rewrites the manifest during the build (it injects the
      # file-association intent-filters then), and the manifest merger and R8
      # run after that. This reads the APK itself, so "multi-window shipped
      # broken" cannot get past a green build. The AAB is built from the same
      # merged manifest, so checking one artifact covers both.
      - name: Verify the shipped APK declares every window
        run: |
          set -euo pipefail
          APK=$(find src-tauri/gen/android -name "*.apk" -path "*/release/*" ! -name "*unsigned*" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find src-tauri/gen/android -name "*.apk" -path "*/release/*" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No release APK found to verify"
            exit 1
          fi

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -r | head -1)
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 not found in $ANDROID_HOME/build-tools"
            exit 1
          fi

          MANIFEST=$("$AAPT2" dump xmltree --file AndroidManifest.xml "$APK")
          for n in 1 2 3; do
            if ! echo "$MANIFEST" | grep -q "com.proteus.opendraft.WindowActivity$n"; then
              echo "::error::WindowActivity$n is not in the built APK — File > New Window would fail for users. See the manifest patch step."
              exit 1
            fi
          done
          # One file-association filter proves the CLI's injection ran too.
          if ! echo "$MANIFEST" | grep -q "fountain"; then
            echo "::error::No file-association intent-filter in the built APK — opening a screenplay from another app would fail."
            exit 1
          fi
          echo "Verified: WindowActivity1-3 and file associations are in $(basename "$APK")"

      # Google Play blocks updates whose native libraries are not laid out for
      # 16 KB memory pages — mandatory for anything targeting Android 15+ since
      # November 2025. The linker flag that does it is emitted by the android
      # branch of src-tauri/build.rs, which a Tauri or NDK upgrade could quietly
      # stop applying: the Tauri CLI passes its own rustflags for Android, and
      # nothing here would fail. The rejection would land days later in the Play
      # Console, on a release that is already tagged. So read the alignment back
      # off the APK that actually ships.
      - name: Verify native libraries are 16 KB page aligned
        run: |
          set -euo pipefail
          APK=$(find src-tauri/gen/android -name "*.apk" -path "*/release/*" ! -name "*unsigned*" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find src-tauri/gen/android -name "*.apk" -path "*/release/*" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No release APK found to check for 16 KB page alignment"
            exit 1
          fi

          # -type f would miss it: llvm-readelf ships as a symlink to llvm-readobj.
          READELF=$(find "$NDK_HOME/toolchains/llvm/prebuilt" -name llvm-readelf \( -type f -o -type l \) | head -1)
          if [ -z "$READELF" ]; then
            echo "::error::llvm-readelf not found under $NDK_HOME — cannot verify 16 KB page alignment"
            exit 1
          fi

          WORK=$(mktemp -d)
          unzip -q "$APK" 'lib/*' -d "$WORK"
          SOS=$(find "$WORK/lib" -name "*.so" | sort)
          if [ -z "$SOS" ]; then
            echo "::error::No native libraries inside $(basename "$APK") — the Rust library did not make it into the APK."
            exit 1
          fi

          FAILED=0
          for SO in $SOS; do
            NAME="${SO#"$WORK"/lib/}"
            MIN=""
            for ALIGN in $("$READELF" -l "$SO" | awk '$1 == "LOAD" { print $NF }'); do
              BYTES=$((ALIGN))
              if [ -z "$MIN" ] || [ "$BYTES" -lt "$MIN" ]; then
                MIN=$BYTES
              fi
            done
            if [ -z "$MIN" ]; then
              echo "::error::$NAME has no LOAD segments — it is not a loadable library."
              FAILED=1
            elif [ "$MIN" -lt 16384 ]; then
              echo "::error::$NAME is aligned to $MIN bytes, not 16384 — Google Play will reject this bundle, and the app would not load on a 16 KB device. See the android branch of src-tauri/build.rs."
              FAILED=1
            else
              echo "  $NAME: aligned to $MIN bytes"
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          # Alignment inside the ELF only helps if the library is also stored
          # uncompressed at a page boundary inside the APK, so the loader can
          # map it straight out of the archive. `zipalign -c -P 16` is not the
          # check for that: it has nothing to say about entries that are
          # compressed, so an APK that deflates its libraries passes it.
          APK="$APK" python3 << 'PYEOF'
          import os, struct, sys, zipfile

          apk = os.environ["APK"]
          bad = []
          with zipfile.ZipFile(apk) as z, open(apk, "rb") as raw:
              libs = [i for i in z.infolist()
                      if i.filename.startswith("lib/") and i.filename.endswith(".so")]
              if not libs:
                  sys.exit("::error::No lib/*.so entries in %s" % os.path.basename(apk))
              for info in libs:
                  if info.compress_type != zipfile.ZIP_STORED:
                      bad.append("%s is compressed, so it cannot be mapped from the APK "
                                 "(set jniLibs useLegacyPackaging = false)" % info.filename)
                      continue
                  # The central directory records where the local header starts;
                  # the payload sits past that header's name and extra fields.
                  raw.seek(info.header_offset)
                  header = raw.read(30)
                  name_len, extra_len = struct.unpack("<HH", header[26:30])
                  data_offset = info.header_offset + 30 + name_len + extra_len
                  if data_offset % 16384:
                      bad.append("%s starts at offset %d, which is not a 16 KB boundary"
                                 % (info.filename, data_offset))

          for problem in bad:
              print("::error::%s" % problem)
          if bad:
              sys.exit("%d native librar%s not packaged for 16 KB pages."
                       % (len(bad), "y is" if len(bad) == 1 else "ies are"))
          print("Verified: every native library in %s is stored uncompressed on a "
                "16 KB boundary" % os.path.basename(apk))
          PYEOF

      - name: Build Android AAB
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: npx --prefix frontend tauri android build --aab

      - name: Prepare artifacts
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p android-artifacts

          # Find and rename APK
          APK=$(find src-tauri/gen/android -name "*.apk" -path "*/release/*" ! -name "*unsigned*" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find src-tauri/gen/android -name "*.apk" -path "*/release/*" | head -1)
          fi
          if [ -n "$APK" ]; then
            cp "$APK" "android-artifacts/OpenDraft_${VERSION}_android.apk"
            echo "APK: $APK -> OpenDraft_${VERSION}_android.apk"
          fi

          # Find and rename AAB (must be from outputs/bundle, not intermediates)
          AAB=$(find src-tauri/gen/android -name "*.aab" -path "*/outputs/bundle/*" | head -1)
          if [ -z "$AAB" ]; then
            AAB=$(find src-tauri/gen/android -name "*.aab" -path "*Release*" ! -path "*/intermediates/*" | head -1)
          fi
          if [ -n "$AAB" ]; then
            cp "$AAB" "android-artifacts/OpenDraft_${VERSION}_android.aab"
            echo "AAB: $AAB -> OpenDraft_${VERSION}_android.aab"
          fi

          ls -la android-artifacts/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: android-artifacts/*
          draft: true

      - name: Upload AAB artifact for store submission
        uses: actions/upload-artifact@v5
        with:
          name: android-aab
          path: android-artifacts/*.aab

  build-intel-mac:
    # Pinned to macos-15 — see build-mac-appstore. codesign/notarize
    # hangs on macos-26 until the step times out.
    runs-on: macos-15
    name: Build (macOS Intel)

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # A manual re-run is dispatched from a branch, so the tag has to
          # be checked out explicitly or we would build the wrong commit.
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Shared with .github/workflows/rebuild-macos-intel.yml so the
          # ad-hoc recovery build and this one warm the same cache. Without
          # it the key includes the job name and the two never share.
          shared-key: macos-intel
          # Keep what compiled before a failure. Without this the cache is dropped,
          # so every retry restarts cold and re-hits whatever limit it just missed.
          cache-on-failure: true

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          VITE_API_BASE: http://localhost:18321/api

      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured — build will be unsigned"
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          # A keychain locks itself again after five minutes of inactivity.
          # The arm64 build compiles for longer than that, so codesign reached
          # a re-locked keychain and blocked forever waiting for an unlock no
          # headless runner can answer: the job hit its 90-minute timeout with
          # codesign still running, and every retry did the same. The jobs that
          # signed within five minutes were unaffected, which is why only this
          # one failed. Six hours is longer than any build here.
          security set-keychain-settings -lut 21600 build.keychain
          security import $RUNNER_TEMP/certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm $RUNNER_TEMP/certificate.p12

      - name: Patch tauri.conf.json for CI
        run: |
          cd src-tauri
          node -e "
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('tauri.conf.json', 'utf8'));
          cfg.build.beforeBuildCommand = '';
          cfg.build.beforeDevCommand = '';
          fs.writeFileSync('tauri.conf.json', JSON.stringify(cfg, null, 2));
          "

      # See the matrix job — fails in seconds when Apple's agreement lapsed,
      # instead of after the build in a step that may hang until it times out.
      - name: Verify Apple notarization access
        timeout-minutes: 5
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: .github/scripts/check-notarization-access.sh

      # Direct CLI call, not tauri-action — see the matrix job for why.
      - name: Build Tauri app
        timeout-minutes: 90
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: npx --prefix frontend tauri build --target x86_64-apple-darwin

      - name: Stage Intel DMG
        run: |
          VERSION="${RELEASE_TAG#v}"
          DMG=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG produced for the Intel build"
            exit 1
          fi
          mkdir -p intel-artifacts
          cp "$DMG" "intel-artifacts/OpenDraft_${VERSION}_x64.dmg"
          ls -la intel-artifacts/

      - name: Upload Intel DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: intel-artifacts/*
          draft: true

  build-intel-mac-legacy:
    # Pinned to macos-15 — see build-mac-appstore. codesign/notarize
    # hangs on macos-26 until the step times out.
    runs-on: macos-15
    name: Build (macOS Intel Legacy)

    env:
      MACOSX_DEPLOYMENT_TARGET: '10.13'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # A manual re-run is dispatched from a branch, so the tag has to
          # be checked out explicitly or we would build the wrong commit.
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Shared with .github/workflows/rebuild-macos-intel.yml so the
          # ad-hoc recovery build and this one warm the same cache. Without
          # it the key includes the job name and the two never share.
          shared-key: macos-intel-legacy
          # Keep what compiled before a failure. Without this the cache is dropped,
          # so every retry restarts cold and re-hits whatever limit it just missed.
          cache-on-failure: true

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend (targeting Safari 13 for Catalina compatibility)
        run: cd frontend && npm run build
        env:
          VITE_API_BASE: http://localhost:18321/api
          BUILD_TARGET: es2019

      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured — build will be unsigned"
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          # A keychain locks itself again after five minutes of inactivity.
          # The arm64 build compiles for longer than that, so codesign reached
          # a re-locked keychain and blocked forever waiting for an unlock no
          # headless runner can answer: the job hit its 90-minute timeout with
          # codesign still running, and every retry did the same. The jobs that
          # signed within five minutes were unaffected, which is why only this
          # one failed. Six hours is longer than any build here.
          security set-keychain-settings -lut 21600 build.keychain
          security import $RUNNER_TEMP/certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm $RUNNER_TEMP/certificate.p12

      - name: Patch tauri.conf.json for legacy CI
        run: |
          cd src-tauri
          node -e "
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('tauri.conf.json', 'utf8'));
          cfg.build.beforeBuildCommand = '';
          cfg.build.beforeDevCommand = '';
          cfg.bundle.macOS = cfg.bundle.macOS || {};
          cfg.bundle.macOS.minimumSystemVersion = '10.13';
          fs.writeFileSync('tauri.conf.json', JSON.stringify(cfg, null, 2));
          "

      # See the matrix job — fails in seconds when Apple's agreement lapsed,
      # instead of after the build in a step that may hang until it times out.
      - name: Verify Apple notarization access
        timeout-minutes: 5
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: .github/scripts/check-notarization-access.sh

      - name: Build Tauri app
        id: tauri_build_legacy
        timeout-minutes: 90
        continue-on-error: true
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: '10.13'
        run: npx --prefix frontend tauri build --target x86_64-apple-darwin

      - name: Build Tauri app (retry)
        if: steps.tauri_build_legacy.outcome == 'failure'
        timeout-minutes: 90
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: '10.13'
        run: npx --prefix frontend tauri build --target x86_64-apple-darwin

      - name: Stage legacy DMG artifact
        id: stage_legacy
        run: |
          VERSION="${RELEASE_TAG#v}"
          DMG=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found for legacy Intel build"
            exit 1
          fi
          mkdir -p legacy-artifacts
          cp "$DMG" "legacy-artifacts/OpenDraft_${VERSION}_x86_64-legacy.dmg"
          ls -la legacy-artifacts/

      - name: Upload legacy DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: legacy-artifacts/*
          draft: true

  build-ios:
    runs-on: macos-26
    name: Build (iOS)

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # A manual re-run is dispatched from a branch, so the tag has to
          # be checked out explicitly or we would build the wrong commit.
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Keep what compiled before a failure. Without this the cache is dropped,
          # so every retry restarts cold and re-hits whatever limit it just missed.
          cache-on-failure: true

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Import Apple Distribution certificate
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$IOS_CERTIFICATE" ]; then
            echo "::error::IOS_CERTIFICATE secret is required for iOS builds"
            exit 1
          fi
          echo "$IOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          # A keychain locks itself again after five minutes of inactivity.
          # The arm64 build compiles for longer than that, so codesign reached
          # a re-locked keychain and blocked forever waiting for an unlock no
          # headless runner can answer: the job hit its 90-minute timeout with
          # codesign still running, and every retry did the same. The jobs that
          # signed within five minutes were unaffected, which is why only this
          # one failed. Six hours is longer than any build here.
          security set-keychain-settings -lut 21600 build.keychain
          security import $RUNNER_TEMP/certificate.p12 -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm $RUNNER_TEMP/certificate.p12
          echo "Apple Distribution certificate imported"

      - name: Install provisioning profile
        env:
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          if [ -z "$IOS_PROVISION_PROFILE" ]; then
            echo "::error::IOS_PROVISION_PROFILE secret is required for iOS builds"
            exit 1
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISION_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/opendraft.mobileprovision
          echo "Provisioning profile installed"

      - name: Patch tauri.conf.json for iOS CI
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd src-tauri
          python3 -c "
          import json, os
          team_id = os.environ['APPLE_TEAM_ID']
          with open('tauri.conf.json') as f:
              cfg = json.load(f)
          cfg['build']['beforeBuildCommand'] = ''
          cfg['build']['beforeDevCommand'] = ''
          cfg['bundle'].pop('externalBin', None)
          ios = cfg['bundle'].setdefault('iOS', {})
          ios['developmentTeam'] = team_id
          # Use single visible window for iOS (no splashscreen on mobile)
          cfg['app']['windows'] = [{
              'label': 'main',
              'url': 'index.html',
              'title': 'OpenDraft',
              'width': 1280,
              'height': 800,
              'resizable': True,
              'fullscreen': False,
              'visible': True
          }]
          with open('tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2)
          "

      - name: Setup root package.json for Xcode build
        run: |
          echo '{"private":true,"scripts":{"tauri":"tauri"}}' > package.json
          ln -sf frontend/node_modules node_modules

      - name: Configure iOS manual signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Extract provisioning profile UUID
          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/opendraft.mobileprovision
          export PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          export PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"

          export PBXPROJ="src-tauri/gen/apple/opendraft.xcodeproj/project.pbxproj"

          # Patch pbxproj with Python for reliable multiline edits
          python3 - "$PBXPROJ" << 'PYEOF'
          import os, sys

          team_id = os.environ['APPLE_TEAM_ID']
          profile_uuid = os.environ['PROFILE_UUID']
          profile_name = os.environ['PROFILE_NAME']
          pbxproj = sys.argv[1]

          with open(pbxproj) as f:
              lines = f.readlines()

          out = []
          for line in lines:
              line = line.replace('CODE_SIGN_IDENTITY = "iPhone Developer"', 'CODE_SIGN_IDENTITY = "Apple Distribution"')
              line = line.replace('CODE_SIGN_IDENTITY = ""', 'CODE_SIGN_IDENTITY = "Apple Distribution"')
              line = line.replace('DEVELOPMENT_TEAM = ""', f'DEVELOPMENT_TEAM = "{team_id}"')
              out.append(line)
              stripped = line.strip()
              if stripped == 'CODE_SIGN_IDENTITY = "Apple Distribution";':
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(f'{indent}CODE_SIGN_STYLE = Manual;\n')
                  out.append(f'{indent}PROVISIONING_PROFILE = "{profile_uuid}";\n')
                  out.append(f'{indent}PROVISIONING_PROFILE_SPECIFIER = "{profile_name}";\n')
              if 'DevelopmentTeam' in stripped and '=' in stripped and 'TargetAttributes' not in stripped:
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(f'{indent}ProvisioningStyle = Manual;\n')

          with open(pbxproj, 'w') as f:
              f.writelines(out)
          print(f'Configured: team={team_id}, profile={profile_name} ({profile_uuid})')
          PYEOF

          # Write ExportOptions.plist
          python3 - << 'PYEOF'
          import os
          team = os.environ['APPLE_TEAM_ID']
          name = os.environ['PROFILE_NAME']
          plist = f"""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>{team}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.proteus.opendraft</key>
                  <string>{name}</string>
              </dict>
          </dict>
          </plist>"""
          import textwrap
          with open('src-tauri/gen/apple/ExportOptions.plist', 'w') as f:
              f.write(textwrap.dedent(plist).lstrip())
          PYEOF
          echo "iOS signing configured for manual distribution"

      - name: Build iOS app
        # Matches the macOS jobs. codesign can wedge indefinitely reaching
        # Apple's timestamp service — without a cap this step rode the 6-hour
        # runner default while the macOS jobs gave up after 90 minutes, so one
        # flake held a release for an afternoon instead of failing fast enough
        # to re-run. See the v0.23.1 build.
        timeout-minutes: 90
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: npx --prefix frontend tauri ios build --export-method app-store-connect

      - name: Patch Info.plist with file association declarations
        run: |
          # Tauri regenerates Info.plist from its own template on every build,
          # and XcodeGen cannot inject complex nested structures like
          # CFBundleDocumentTypes. Patch the built .app, re-sign, and re-export.
          ARCHIVE=$(find src-tauri/gen/apple/build -name "*.xcarchive" | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "::error::No .xcarchive found"
            exit 1
          fi
          APP_PATH="$ARCHIVE/Products/Applications/OpenDraft.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::No .app found in xcarchive"
            exit 1
          fi

          # Save original entitlements for re-signing (:-  outputs XML format)
          codesign -d --entitlements :- "$APP_PATH" > /tmp/orig_ent.plist 2>/dev/null

          # Patch Info.plist
          python3 << 'PYEOF'
          import plistlib, glob, os

          archive = glob.glob("src-tauri/gen/apple/build/*.xcarchive")[0]
          plist_path = os.path.join(archive, "Products/Applications/OpenDraft.app/Info.plist")

          with open(plist_path, "rb") as f:
              plist = plistlib.load(f)

          plist["LSSupportsOpeningDocumentsInPlace"] = True

          # Tauri's template carries no privacy usage strings. The image inputs
          # (Insert Image, title page, character profiles, beat board) are
          # accept="image/*", so WKWebView offers "Take Photo" — and iOS kills
          # the app outright the moment the camera is touched without this key.
          plist["NSCameraUsageDescription"] = (
              "OpenDraft uses the camera when you choose Take Photo to add an image to "
              "a script, title page, character profile or beat board."
          )
          plist["NSPhotoLibraryUsageDescription"] = (
              "OpenDraft needs access to your photos so you can add an image to a "
              "script, title page, character profile or beat board."
          )

          plist["CFBundleDocumentTypes"] = [
              {"CFBundleTypeName": "Final Draft Screenplay", "CFBundleTypeRole": "Editor",
               "LSHandlerRank": "Default", "LSItemContentTypes": ["com.finaldraft.fdx"]},
              {"CFBundleTypeName": "Fountain Screenplay", "CFBundleTypeRole": "Editor",
               "LSHandlerRank": "Default", "LSItemContentTypes": ["com.proteus.opendraft.fountain"]},
              {"CFBundleTypeName": "OpenDraft Screenplay", "CFBundleTypeRole": "Editor",
               "LSHandlerRank": "Owner", "LSItemContentTypes": ["com.proteus.opendraft.document"]},
              # Fade In and OSF. iOS matches document types by UTI alone — a
              # CFBundleTypeExtensions entry with no LSItemContentTypes, which is all
              # Tauri generates for these two, does nothing here. Without them "Open in
              # OpenDraft" never appears for a .fadein in Files (issue #64).
              {"CFBundleTypeName": "Fade In Screenplay", "CFBundleTypeRole": "Editor",
               "LSHandlerRank": "Alternate", "LSItemContentTypes": ["com.kentt.fadein"]},
              {"CFBundleTypeName": "Open Screenplay Format", "CFBundleTypeRole": "Editor",
               "LSHandlerRank": "Alternate", "LSItemContentTypes": ["com.proteus.opendraft.osf"]},
              {"CFBundleTypeName": "Text File", "CFBundleTypeRole": "Editor",
               "LSHandlerRank": "Alternate", "LSItemContentTypes": ["public.plain-text"]},
          ]

          plist["UTImportedTypeDeclarations"] = [
              {"UTTypeIdentifier": "com.finaldraft.fdx", "UTTypeDescription": "Final Draft Screenplay",
               "UTTypeConformsTo": ["public.xml"],
               "UTTypeTagSpecification": {"public.filename-extension": ["fdx"], "public.mime-type": "application/xml"}},
              {"UTTypeIdentifier": "com.proteus.opendraft.fountain", "UTTypeDescription": "Fountain Screenplay",
               "UTTypeConformsTo": ["public.plain-text"],
               "UTTypeTagSpecification": {"public.filename-extension": ["fountain"], "public.mime-type": "text/plain"}},
              {"UTTypeIdentifier": "com.proteus.opendraft.document", "UTTypeDescription": "OpenDraft Screenplay",
               "UTTypeConformsTo": ["public.json"],
               "UTTypeTagSpecification": {"public.filename-extension": ["odraft"], "public.mime-type": "application/json"}},
              # Imported, not exported: the format belongs to Fade In. It is a zip
              # container, so it conforms to the archive type rather than to text — which
              # is also why it has to be read as bytes on the way in.
              {"UTTypeIdentifier": "com.kentt.fadein", "UTTypeDescription": "Fade In Screenplay",
               "UTTypeConformsTo": ["public.zip-archive"],
               "UTTypeTagSpecification": {"public.filename-extension": ["fadein"], "public.mime-type": "application/zip"}},
              {"UTTypeIdentifier": "com.proteus.opendraft.osf", "UTTypeDescription": "Open Screenplay Format",
               "UTTypeConformsTo": ["public.xml"],
               "UTTypeTagSpecification": {"public.filename-extension": ["osf"], "public.mime-type": "application/xml"}},
          ]

          with open(plist_path, "wb") as f:
              plistlib.dump(plist, f)
          print(f"Patched {plist_path} with file association declarations")
          PYEOF

          # Re-sign the .app
          SIGN_ID=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$SIGN_ID" ]; then
            echo "::error::No Apple Distribution signing identity found"
            exit 1
          fi
          codesign --force --sign "$SIGN_ID" --entitlements /tmp/orig_ent.plist "$APP_PATH"
          echo "Re-signed .app with: $SIGN_ID"

          # Re-export IPA from the patched archive
          EXPORT_DIR="src-tauri/gen/apple/build/patched-export"
          EXPORT_OPTIONS=$(find src-tauri/gen/apple -name "ExportOptions.plist" | head -1)
          if [ -z "$EXPORT_OPTIONS" ]; then
            echo "::error::No ExportOptions.plist found"
            exit 1
          fi
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          # Replace original IPA with patched version
          NEW_IPA=$(find "$EXPORT_DIR" -name "*.ipa" | head -1)
          if [ -z "$NEW_IPA" ]; then
            echo "::error::Re-export did not produce an IPA"
            exit 1
          fi
          OLD_IPA=$(find src-tauri/gen/apple/build -maxdepth 2 -name "*.ipa" ! -path "*/patched-export/*" | head -1)
          cp "$NEW_IPA" "$OLD_IPA"
          echo "Replaced IPA with patched version containing file associations"

      - name: Prepare artifact
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p ios-artifacts
          IPA=$(find src-tauri/gen/apple/build -name "*.ipa" ! -path "*/patched-export/*" | head -1)
          if [ -n "$IPA" ]; then
            cp "$IPA" "ios-artifacts/OpenDraft_${VERSION}_ios.ipa"
            echo "IPA: $IPA -> OpenDraft_${VERSION}_ios.ipa"
          fi
          ls -la ios-artifacts/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ios-artifacts/*
          draft: true

      - name: Upload IPA artifact for store submission
        uses: actions/upload-artifact@v5
        with:
          name: ios-ipa
          path: ios-artifacts/*.ipa

  build-mac-appstore:
    # Pinned to macos-15 — codesign on macos-26 hangs ~24 min on cert-chain
    # validation (likely OCSP/CRL network calls). The same job ran in 2-4 min
    # on macos-26 in v0.16.0/v0.16.1, then started hanging mid-Apr 2026 after
    # a runner image update. Revisit when the macos-26 codesign issue is fixed.
    runs-on: macos-15
    name: Build (macOS App Store)
    # Job-level, so it caps the whole job rather than one step. 60 was not
    # enough for a cold build: v0.22.0 cancelled here at exactly 60 minutes.
    timeout-minutes: 120
    # Keep going even if the App Store .pkg fails — store submission is a
    # follow-up step that should not block the public release.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # A manual re-run is dispatched from a branch, so the tag has to
          # be checked out explicitly or we would build the wrong commit.
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Keep what compiled before a failure. Without this the cache is dropped,
          # so every retry restarts cold and re-hits whatever limit it just missed.
          cache-on-failure: true

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        # The App Store build and the .dmg are the same binary on the same OS,
        # so the update notice cannot tell them apart at runtime and its OS
        # fallback would offer an App Store copy a .dmg download — wrong, and
        # something Apple objects to. This is the one job that has to say.
        env:
          VITE_OPENDRAFT_CHANNEL: mas
        run: cd frontend && npm run build

      - name: Import Apple Distribution certificate
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$IOS_CERTIFICATE" ]; then
            echo "::error::IOS_CERTIFICATE (Apple Distribution) secret is required for Mac App Store builds"
            exit 1
          fi
          echo "$IOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/distribution.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          # A keychain locks itself again after five minutes of inactivity.
          # The arm64 build compiles for longer than that, so codesign reached
          # a re-locked keychain and blocked forever waiting for an unlock no
          # headless runner can answer: the job hit its 90-minute timeout with
          # codesign still running, and every retry did the same. The jobs that
          # signed within five minutes were unaffected, which is why only this
          # one failed. Six hours is longer than any build here.
          security set-keychain-settings -lut 21600 build.keychain
          security import $RUNNER_TEMP/distribution.p12 -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "" build.keychain
          rm $RUNNER_TEMP/distribution.p12
          echo "Apple Distribution certificate imported"

      - name: Import Mac Installer certificate
        env:
          MAC_INSTALLER_CERTIFICATE: ${{ secrets.MAC_INSTALLER_CERTIFICATE }}
          MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MAC_INSTALLER_CERTIFICATE" ]; then
            echo "::error::MAC_INSTALLER_CERTIFICATE secret is required for Mac App Store builds"
            exit 1
          fi
          echo "$MAC_INSTALLER_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/installer.p12
          security import $RUNNER_TEMP/installer.p12 -k build.keychain \
            -P "$MAC_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "" build.keychain
          rm $RUNNER_TEMP/installer.p12
          echo "Mac Installer certificate imported"

      - name: Install provisioning profile
        env:
          MAC_APPSTORE_PROVISION_PROFILE: ${{ secrets.MAC_APPSTORE_PROVISION_PROFILE }}
        run: |
          if [ -z "$MAC_APPSTORE_PROVISION_PROFILE" ]; then
            echo "::error::MAC_APPSTORE_PROVISION_PROFILE secret is required"
            exit 1
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$MAC_APPSTORE_PROVISION_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/opendraft-macos.provisionprofile
          echo "macOS provisioning profile installed"

      - name: Patch tauri.conf.json for Mac App Store CI
        run: |
          cd src-tauri
          python3 -c "
          import json
          with open('tauri.conf.json') as f:
              cfg = json.load(f)
          cfg['build']['beforeBuildCommand'] = ''
          cfg['build']['beforeDevCommand'] = ''
          cfg['bundle'].pop('externalBin', None)
          with open('tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2)
          "

      - name: Set export compliance (no custom encryption)
        run: |
          PLIST="src-tauri/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
            echo "Export compliance flag set in $PLIST"
          fi
          # Also set in the macOS Info.plist template if it exists
          MAC_PLIST="src-tauri/Info.plist"
          echo "Export compliance configured for macOS App Store"

      - name: Build Tauri app (unsigned)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: APPLE_SIGNING_IDENTITY="-" npx --prefix frontend tauri build --bundles app

      - name: Inject export compliance into built app
        run: |
          APP_PLIST="src-tauri/target/release/bundle/macos/OpenDraft.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$APP_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$APP_PLIST"
          echo "Export compliance flag set in built app"

      - name: Sign and package for App Store
        run: |
          APP_PATH="src-tauri/target/release/bundle/macos/OpenDraft.app"
          ENTITLEMENTS="src-tauri/entitlements/app.entitlements"

          # Find signing identities from keychain
          APP_SIGN_ID=$(security find-identity -v -p codesigning build.keychain | grep "Apple Distribution\|3rd Party Mac Developer Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          INSTALLER_SIGN_ID=$(security find-identity -v build.keychain | grep "Mac Installer Distribution\|3rd Party Mac Developer Installer" | head -1 | sed 's/.*"\(.*\)".*/\1/')

          echo "App signing identity: $APP_SIGN_ID"
          echo "Installer signing identity: $INSTALLER_SIGN_ID"

          if [ -z "$APP_SIGN_ID" ]; then
            echo "::error::No app signing identity found in keychain"
            exit 1
          fi
          if [ -z "$INSTALLER_SIGN_ID" ]; then
            echo "::error::No installer signing identity found in keychain"
            exit 1
          fi

          # Sign main binary
          # --timestamp=none: App Store doesn't require RFC3161 timestamps
          # (Apple re-signs on store ingestion). Skipping avoids 30+ minute
          # hangs when timestamp.apple.com is slow/unreachable from CI.
          # Sign main binary
          codesign --force --options runtime --timestamp=none \
            --entitlements "$ENTITLEMENTS" \
            --sign "$APP_SIGN_ID" \
            "$APP_PATH/Contents/MacOS/opendraft"

          # Sign the entire .app bundle
          codesign --force --deep --options runtime --timestamp=none \
            --entitlements "$ENTITLEMENTS" \
            --sign "$APP_SIGN_ID" \
            "$APP_PATH"

          # Verify signature
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          # Embed provisioning profile
          cp ~/Library/MobileDevice/Provisioning\ Profiles/opendraft-macos.provisionprofile \
            "$APP_PATH/Contents/embedded.provisionprofile"

          # Re-sign after embedding profile
          codesign --force --deep --options runtime --timestamp=none \
            --entitlements "$ENTITLEMENTS" \
            --sign "$APP_SIGN_ID" \
            "$APP_PATH"

          # Build .pkg installer
          productbuild --component "$APP_PATH" /Applications \
            --sign "$INSTALLER_SIGN_ID" \
            "OpenDraft.pkg"

          echo "App Store package built: OpenDraft.pkg"

      - name: Upload pkg artifact for store submission
        uses: actions/upload-artifact@v5
        with:
          name: macos-pkg
          path: OpenDraft.pkg

  # ── Combined backend+collab Docker image ───────────────────────────────
  # Builds Dockerfile.combined for linux/amd64 + linux/arm64 and pushes to
  # ghcr.io/<owner>/opendraft-combined with tags X.Y.Z, X.Y, latest, sha-<short>.
  build-docker:
    runs-on: ubuntu-latest
    name: Build & Push Combined Docker Image

    steps:
      - uses: actions/checkout@v5
        with:
          # A manual re-run is dispatched from a branch, so the tag has to
          # be checked out explicitly or we would build the wrong commit.
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opendraft-combined
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.combined
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Submit to App Stores ────────────────────────────────────────────────
  # Runs only after ALL build jobs succeed. Downloads built artifacts and
  # submits them to the iOS App Store, macOS App Store, and Google Play Store.
  submit-stores:
    needs: [build-desktop, build-android, build-ios, build-mac-appstore, build-intel-mac, build-intel-mac-legacy, build-docker]
    runs-on: macos-latest
    name: Submit to App Stores

    steps:
      - name: Download iOS IPA artifact
        uses: actions/download-artifact@v5
        with:
          name: ios-ipa
          path: ios-artifacts

      - name: Download macOS pkg artifact
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: macos-pkg
          path: macos-artifacts

      - name: Download Android AAB artifact
        uses: actions/download-artifact@v5
        with:
          name: android-aab
          path: android-artifacts

      - name: Upload iOS IPA to App Store Connect
        env:
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        # Treat "already uploaded" as success on re-runs of the same tag, and
        # don't let an iOS upload failure cascade-skip the macOS pkg upload
        # below.
        continue-on-error: true
        run: |
          if [ -z "$APPSTORE_API_KEY" ]; then
            echo "::warning::APPSTORE_API_KEY not configured — skipping iOS App Store upload"
            exit 0
          fi

          mkdir -p ~/.private_keys
          echo "$APPSTORE_API_KEY" | base64 --decode > ~/.private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

          IPA=$(find ios-artifacts -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then
            echo "::warning::No IPA file found in artifacts — skipping iOS App Store upload"
            exit 0
          fi

          echo "Uploading $IPA to App Store Connect..."
          ALTOOL_LOG=$(mktemp)
          if xcrun altool --upload-app \
            --file "$IPA" \
            --type ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID" 2>&1 | tee "$ALTOOL_LOG"; then
            echo "iOS upload complete"
          elif grep -q "ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE\|already been used" "$ALTOOL_LOG"; then
            echo "::warning::iOS build for this version was already uploaded — treating as success"
          else
            echo "::error::iOS upload failed"
            exit 1
          fi

      - name: Upload macOS pkg to App Store Connect
        # Always run, even if iOS upload above failed — they're independent.
        if: always() && !cancelled()
        continue-on-error: true
        env:
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          if [ -z "$APPSTORE_API_KEY" ]; then
            echo "::warning::APPSTORE_API_KEY not configured — skipping macOS App Store upload"
            exit 0
          fi

          mkdir -p ~/.private_keys
          echo "$APPSTORE_API_KEY" | base64 --decode > ~/.private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

          PKG=$(find macos-artifacts -name "*.pkg" 2>/dev/null | head -1)
          if [ -z "$PKG" ]; then
            echo "::warning::No pkg file found — skipping Mac App Store upload (build-mac-appstore likely failed; submit manually as a follow-up)"
            exit 0
          fi

          echo "Uploading $PKG to App Store Connect..."
          ALTOOL_LOG=$(mktemp)
          if xcrun altool --upload-app \
            --file "$PKG" \
            --type macos \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID" 2>&1 | tee "$ALTOOL_LOG"; then
            echo "macOS upload complete"
          elif grep -q "ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE\|already been used" "$ALTOOL_LOG"; then
            echo "::warning::macOS pkg for this version was already uploaded — treating as success"
          else
            echo "::error::macOS pkg upload failed"
            exit 1
          fi

      - name: Upload Android AAB to Google Play (production)
        # Don't fail the release if the Play Store credentials are stale or
        # the AAB version was already uploaded — submit-stores must still
        # complete so publish-release can flip the GitHub release out of draft.
        continue-on-error: true
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 not configured — skipping Play Store upload"
            exit 0
          fi

          AAB=$(find android-artifacts -name "*.aab" | head -1)
          if [ -z "$AAB" ]; then
            echo "::warning::No AAB file found in artifacts — skipping Play Store upload"
            exit 0
          fi

          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > /tmp/play-service-account.json

          # Install fastlane
          gem install fastlane --no-document

          echo "Uploading $AAB to Google Play production track..."
          if ! fastlane supply \
            --aab "$AAB" \
            --track production \
            --package_name com.proteus.opendraft \
            --json_key /tmp/play-service-account.json \
            --skip_upload_metadata \
            --skip_upload_images \
            --skip_upload_screenshots \
            --skip_upload_changelogs \
            --skip_upload_apk; then
            echo "::warning::Play Store upload failed — submit manually as a follow-up"
          fi

          rm /tmp/play-service-account.json
          echo "Google Play upload complete — check Play Console for review status"

  # ── Publish release & update download links ─────────────────────────────
  # Runs only after ALL build jobs succeed. Verifies assets exist on the
  # draft release, publishes it, then updates download links in README.md
  # and landing/index.html so they always point to verified files.
  publish-release:
    needs: [submit-stores]
    runs-on: ubuntu-latest
    name: Publish Release & Update Links

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Get version from tag
        id: version
        run: echo "VERSION=${RELEASE_TAG#v}" >> $GITHUB_OUTPUT

      - name: Verify release assets exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ env.RELEASE_TAG }}"
          REPO="${{ github.repository }}"

          EXPECTED_ASSETS=(
            "OpenDraft_${VERSION}_aarch64.dmg"
            "OpenDraft_${VERSION}_x64-setup.exe"
            "OpenDraft_${VERSION}_x64_en-US.msi"
            "OpenDraft_${VERSION}_amd64.deb"
            "OpenDraft_${VERSION}_amd64.AppImage"
            "OpenDraft_${VERSION}_android.apk"
            "OpenDraft_${VERSION}_ios.ipa"
            "OpenDraft_${VERSION}_x64.dmg"
            "OpenDraft_${VERSION}_x86_64-legacy.dmg"
          )

          echo "Checking release assets for ${TAG}..."
          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name')

          MISSING=0
          for expected in "${EXPECTED_ASSETS[@]}"; do
            if echo "$ASSETS" | grep -q "^${expected}$"; then
              echo "  [OK] ${expected}"
            else
              echo "  [MISSING] ${expected}"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "::error::${MISSING} expected assets are missing from the release"
            exit 1
          fi

          echo "All expected assets verified."

      - name: Publish release (remove draft status)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ env.RELEASE_TAG }}" \
            --repo "${{ github.repository }}" \
            --draft=false
          echo "Release ${{ env.RELEASE_TAG }} published"

      # Download links are updated in the version bump commit (release.sh)
      # before the tag is pushed, so they're already on main by this point.
