name: Linux native title-bar checks

on:
  pull_request:
    paths:
      - 'src-tauri/src/linux_titlebar.rs'
      - 'src-tauri/src/lib.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/test-linux-titlebar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  titlebar:
    name: Linux GTK title-bar routing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend for Tauri context
        run: cd frontend && npm ci && npm run build
      - name: Compile Linux app and check native GTK input ordering
        working-directory: src-tauri
        run: xvfb-run -a cargo test --locked --lib linux_titlebar::tests -- --test-threads=1
