name: Android posture bridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/android-src/**'
      - 'test-script/android-fold/**'
      - 'test-script/android_fold_build.py'
      - 'test-script/test_android_fold_build.py'
      - 'test-script/patch-android-local.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/test-android-fold.yml'

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check local and release project wiring
        run: python3 -m unittest discover -s test-script -p test_android_fold_build.py
      - name: Compile Android sources and test posture lifecycle
        run: gradle -p test-script/android-fold testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-fold-unit-results
          path: test-script/android-fold/build/test-results/
