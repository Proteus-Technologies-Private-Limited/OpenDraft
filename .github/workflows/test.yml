name: Tests

# Runs the frontend unit tests and the TypeScript build gate on every push and
# pull request. Before this existed nothing ran `npm test`, so the suite could
# silently rot.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Nothing else compiles the Rust for Android until a release tag: the desktop
  # jobs build for the host, so every `#[cfg(target_os = "android")]` block —
  # the JNI calls behind export, print, the file picker and backups, which is
  # most of what the platform needs from Rust — is invisible to them. A typo
  # there used to surface in `build-android`, mid-release, on the one workflow
  # that cannot be re-run without a tag.
  #
  # This is a type check, not a build: no Gradle, no signing, no APK. It walks
  # the same Cargo graph and expands the same macros as the release build, so
  # it catches what a release would catch in the Rust itself, and nothing about
  # Kotlin, R8 or packaging — those still first run at release time.
  android-rust:
    name: Android (Rust type check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # aarch64 alone. All four ABIs share this source, and the cfg is per-OS
      # rather than per-architecture, so the other three would re-check the
      # same code for three times the minutes.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      # Pinned to the NDK the release build uses (see release.yml's
      # build-android job) so this checks against the same toolchain that
      # ships. Keep the two in step.
      - name: Install the Android NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `tauri::generate_context!()` embeds frontendDist at compile time, so
      # the Rust does not type-check without a real frontend/dist next to it.
      - name: Build the frontend
        run: cd frontend && npm ci && npm run build

      - name: Type-check the Android build
        run: |
          set -euo pipefail
          BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # The Tauri CLI sets these during `tauri android build`; cargo on its
          # own does not, and cc-rs then looks for an `aarch64-linux-android-clang`
          # that no NDK has ever shipped — C build scripts (ring's, among others)
          # fail before any of our code is reached. API 24 is the template's
          # minSdk.
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$BIN/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android24-clang"
          cd src-tauri
          # --lib because that is what Android loads: the binary in main.rs is
          # the desktop entry point and is never built for the platform.
          cargo check --locked --lib --target aarch64-linux-android
