name: Tests

# Runs the frontend unit tests and the TypeScript build gate on every push and
# pull request. Before this existed nothing ran `npm test`, so the suite could
# silently rot.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Unit tests
        run: npm test

      # Every shipped language is complete and well-formed: the same keys as
      # English, the same {{placeholders}} and <tags>, the plural forms the
      # language needs, and the right letters (Persian vs Arabic, French
      # spacing). `npm test` already runs these; they are named here so a
      # missing translation reads as one rather than as a failed unit test.
      # See docs/i18n.md.
      - name: Translations are complete
        run: npx vitest run src/i18n

      # No new hard-coded English in the interface. Anything that must stay
      # English carries an `i18n-ignore` with its reason. Runs from the repo
      # root because the scanner reads frontend/src by that path.
      - name: No hard-coded UI strings
        working-directory: .
        run: node test-script/i18n_scan_literals.mjs --max 0

      # The GitHub release page is written from the About dialog's What's New
      # (.github/scripts/release-notes.py). Every version must still convert,
      # so markup the converter does not know fails here rather than while a
      # release is being published.
      - name: What's New converts to release notes
        working-directory: .
        run: |
          set -euo pipefail
          versions=$(grep -o 'about-subsection-title">v[0-9.]*' frontend/src/components/MenuBar.tsx | sed 's/.*">v//')
          test -n "$versions"
          for v in $versions; do python3 .github/scripts/release-notes.py "$v" --check; done

      - name: Build
        run: npm run build

  # Nothing else compiles the Rust for Android until a release tag: the desktop
  # jobs build for the host, so every `#[cfg(target_os = "android")]` block —
  # the JNI calls behind export, print, the file picker and backups, which is
  # most of what the platform needs from Rust — is invisible to them. A typo
  # there used to surface in `build-android`, mid-release, on the one workflow
  # that cannot be re-run without a tag.
  #
  # This is a type check, not a build: no Gradle, no signing, no APK. It walks
  # the same Cargo graph and expands the same macros as the release build, so
  # it catches what a release would catch in the Rust itself, and nothing about
  # Kotlin, R8 or packaging — those still first run at release time.
  android-rust:
    name: Android (Rust type check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # aarch64 alone. All four ABIs share this source, and the cfg is per-OS
      # rather than per-architecture, so the other three would re-check the
      # same code for three times the minutes.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Host Linux tests, before Android cross-checking. Permissions must not
      # be tested as root, which bypasses the file-only-grant assertions.
      - name: Check portable file-save and recovery safety on Linux
        run: |
          test "$(id -u)" -ne 0
          rustc --edition=2021 --test src-tauri/src/safe_file.rs -o "$RUNNER_TEMP/file-save-tests"
          "$RUNNER_TEMP/file-save-tests"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      # Pinned to the NDK the release build uses (see release.yml's
      # build-android job) so this checks against the same toolchain that
      # ships. Keep the two in step.
      - name: Install the Android NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `tauri::generate_context!()` embeds frontendDist at compile time, so
      # the Rust does not type-check without a real frontend/dist next to it.
      - name: Build the frontend
        run: cd frontend && npm ci && npm run build

      - name: Type-check the Android build
        run: |
          set -euo pipefail
          BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # The Tauri CLI sets these during `tauri android build`; cargo on its
          # own does not, and cc-rs then looks for an `aarch64-linux-android-clang`
          # that no NDK has ever shipped — C build scripts (ring's, among others)
          # fail before any of our code is reached. API 26 is the app's minSdk
          # (bundle.android.minSdkVersion in tauri.conf.json); keep them in step.
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$BIN/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android26-clang"
          cd src-tauri
          # --lib because that is what Android loads: the binary in main.rs is
          # the desktop entry point and is never built for the platform.
          cargo check --locked --lib --target aarch64-linux-android

  macos-file-saves:
    name: macOS (native file saves)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Exercise coordinated text and binary saves and original recovery
        run: |
          xcrun clang -DOPENDRAFT_FILE_TESTING -fobjc-arc -fblocks -c src-tauri/src/macos_file.m -o "$RUNNER_TEMP/macos_file.o"
          ar crs "$RUNNER_TEMP/libopendraft_macos_file.a" "$RUNNER_TEMP/macos_file.o"
          rustc --edition=2021 --test test-script/macos_file_native.rs \
            -L "native=$RUNNER_TEMP" -l static=opendraft_macos_file \
            -l framework=Foundation -l objc -o "$RUNNER_TEMP/macos-file-tests"
          "$RUNNER_TEMP/macos-file-tests"

      - name: Build frontend for Tauri context
        run: cd frontend && npm ci && npm run build
      - name: Check macOS Rust and native build integration
        run: cd src-tauri && cargo check --locked --lib

  ios-simulator:
    name: iOS (tracked Xcode project compile)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check native dictation locale selection and failure guidance
        run: |
          xcrun clang -fobjc-arc -fblocks -framework Foundation \
            -I src-tauri/gen/apple/Sources/opendraft \
            test-script/dictation_native_test.m -o "$RUNNER_TEMP/dictation-native-tests"
          "$RUNNER_TEMP/dictation-native-tests"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Set up root package for the Tauri Xcode build
        run: |
          echo '{"private":true,"scripts":{"tauri":"tauri"}}' > package.json
          ln -s frontend/node_modules node_modules
      # Compile the checked-in project, including FileHelpers.m and framework
      # links. Do not run `ios init`: that would hide errors in the tracked files.
      - name: Compile iOS Simulator app
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: frontend/node_modules/.bin/tauri ios build --target aarch64-sim --debug
