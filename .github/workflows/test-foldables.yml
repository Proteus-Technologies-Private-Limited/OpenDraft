name: Foldable browser tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'test-script/foldables/**'
      - '.github/workflows/test-foldables.yml'

permissions:
  contents: read

jobs:
  browser:
    name: Chromium foldable regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Start Vite
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > "$RUNNER_TEMP/foldable-vite.log" 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/foldable-vite.log"
          exit 1
      - name: Check posture, focus, keyboard and plugin panels
        env:
          OPENDRAFT_TEST_URL: http://127.0.0.1:5173/
        run: |
          python test-script/foldables/posture.py
          python test-script/foldables/regressions.py
      - name: Upload Vite log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: foldable-browser-log
          path: ${{ runner.temp }}/foldable-vite.log
          if-no-files-found: ignore
