[package]
name = "opendraft"
version = "2.17.0"
description = "OpenDraft - Professional Screenwriting Application"
authors = ["OpenDraft"]
edition = "2021"

[lib]
name = "opendraft_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
# See the note on `tauri` below for the history behind these versions.
tauri-build = { version = "=2.6.3", features = [] }
cc = "1"

[dependencies]
# Was pinned to 2.10.3 (commit c1a5dd1) because v0.17.0 cold-started and died on
# Android 15 — a SIGABRT from a panic in the Rust .so, traced to wry 0.55 / tao
# 0.35, which tauri 2.11 pulled in.
#
# Unpinned to 2.11.x because that crash appears to be fixed upstream: wry 0.55.1
# shipped `fix(android): ProGuard keep getId` (wry#1721), closing tauri#15311,
# "panic in tao 0.35.0 on Samsung A9+ Android Tablet". The symptom matches — a
# tao 0.35 panic that only appears in a *minified release* build, which
# `panic = "abort"` below turns into exactly that SIGABRT. The v0.17.0 build
# that crashed used wry 0.55.0, before the fix; 0.55.1 was never tried here.
#
# 2.11 is also the release that added mobile multi-window (tauri#14484), which
# issue #63 needs.
#
# BEFORE BUMPING, re-check the iOS scene workaround in FileHelpers.m. tao's
# `configuration_for_connecting_scene_session` returns a raw pointer to a
# UISceneConfiguration whose objc2 `Retained` it drops on the way out, so the
# object is deallocated before UIKit retains it: SIGSEGV in
# -[UIApplication _connectUISceneFromFBSScene:] on every launch of a device
# build with a scene manifest. It does not reproduce in the simulator.
# OpenDraft works around it by swizzling that delegate method and returning a
# live configuration. If a later tao fixes this, the workaround can go — but
# until then it is load-bearing: without it, iOS multi-window cannot launch.
#
# Still exact-pinned so a transitive bump cannot silently reintroduce this on
# users' phones. Before shipping: cold-start a MINIFIED RELEASE Android APK on a
# physical Android 15 device. A debug build will not reproduce a ProGuard bug.
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# http_fetch carries binary request and response bodies (pictures) across the
# invoke boundary as base64.
base64 = "0.22"
tauri-plugin-sql = { version = "=2.4.0", features = ["sqlite"] }
tauri-plugin-fs = "=2.5.1"
tauri-plugin-dialog = "=2.7.2"
# Opening a URL in the system browser. window.open() does nothing inside the
# iOS web view and takes the Android one down with it (the manual's "Read
# online" link), so external links go through the platform instead.
tauri-plugin-opener = "=2.5.2"
# Reading the clipboard. `navigator.clipboard.read*` is denied outright by the
# Android WebView — it has no permission UI for `clipboard-read`, so every
# promise rejects with NotAllowedError and Edit ▸ Paste could not work at all
# (issue #102). This asks the platform through the app instead of the web view.
tauri-plugin-clipboard-manager = "=2.3.3"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
percent-encoding = "2"

# Match the GTK version already used by Tauri; title-bar routing is Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Use the same runtime (and its Tao re-export) as the application in native tests.
[target.'cfg(target_os = "linux")'.dev-dependencies]
tauri-runtime-wry = { version = "2.11", default-features = false }

# Installed-font lookup for the PDF exporter's fallback (system_fonts.rs).
# Desktop only: mobile has no font directories to scan and the dependency would
# only add to the Android/iOS builds. ttf-parser is already in the tree via
# fontdb; it is named here so the cmap can be read without relying on a
# re-export.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Native persistence only; the webview does not invoke plugin commands.
tauri-plugin-window-state = "=2.4.1"
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# ndk-context was removed deliberately. tao 0.35 (tauri 2.11) stopped
# initializing it, so android_context() panicked unconditionally and
# `panic = "abort"` turned that into a cold-start SIGABRT. The JavaVM and
# Activity now come from tao's own per-activity registry via
# `tauri::tao::platform::android::prelude::main_android_context()`, which
# returns an Option rather than panicking. Do not add it back.

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "=0.3.1"
# Panel windows (panel_windows.rs): wry builds a window.open() window as a bare
# NSWindow + WKWebView, which cannot close itself or show its title. The same
# versions wry 0.55 uses, so nothing new is compiled for these.
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSObject", "NSDictionary", "NSArray", "NSNotification", "NSKeyValueObserving", "NSGeometry"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "block2", "NSApplication", "NSResponder", "NSWindow", "NSView", "NSScreen", "NSEvent"] }
block2 = "=0.6.2"
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKUIDelegate"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
# strip = false: keep symbols so Android crash reports can be symbolicated via
# Play Console "Native debug symbols" upload and ndk-stack. Adds ~MBs to the
# desktop binary but does not affect runtime performance.
strip = false
debug = "line-tables-only"
