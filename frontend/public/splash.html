<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WriTea Draft</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .shell {
    width: 100%; height: 100%;
    border-radius: 28px;
    background: linear-gradient(135deg, #A8C4F8 0%, #6E93EE 45%, #3D5BD9 100%);
    overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .logo {
    width: 180px; height: 180px;
    animation: fadeIn 0.6s ease-out;
  }
  .app-name {
    color: #ffffff;
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 0.5px;
    margin-top: 18px;
    text-shadow: 0 1px 8px rgba(20, 27, 69, 0.35);
    animation: fadeIn 0.8s ease-out 0.2s both;
  }
  .tagline {
    color: rgba(255, 255, 255, 0.9);
    font-size: 13px;
    letter-spacing: 1px;
    margin-top: 8px;
    animation: fadeIn 0.8s ease-out 0.4s both;
  }
  .spinner-container {
    margin-top: 38px;
    animation: fadeIn 0.8s ease-out 0.6s both;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 2px solid rgba(255, 255, 255, 0.25);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .status {
    color: rgba(255, 255, 255, 0.8);
    font-size: 12px;
    margin-top: 16px;
    animation: fadeIn 0.8s ease-out 0.8s both;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="shell" data-tauri-drag-region>
  <img class="logo" src="splash-logo.png" width="180" height="180" alt="WriTea Draft">
  <div class="app-name">WriTea Draft</div>
  <div class="tagline">Professional Screenwriting</div>
  <div class="spinner-container"><div class="spinner"></div></div>
  <div class="status">Starting up...</div>
  </div>
  <script>
    // macOS only gives a window a see-through background when the app opts in to
    // its private API, so on a Mac the splash fills the whole square instead.
    if (/Mac/i.test(navigator.userAgent)) {
      document.querySelector('.shell').style.borderRadius = '0';
    }
  </script>
</body>
</html>
