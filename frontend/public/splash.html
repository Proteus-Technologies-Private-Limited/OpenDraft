<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WriTea Draft</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #141b45;
    background:
      radial-gradient(ellipse at 30% 18%, rgba(110, 147, 238, 0.28), rgba(110, 147, 238, 0) 62%),
      linear-gradient(165deg, #141b45 0%, #1d2a78 58%, #2b44a8 100%);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .logo {
    width: 180px; height: 180px;
    animation: fadeIn 0.6s ease-out;
  }
  .app-name {
    color: #ffffff;
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 0.5px;
    margin-top: 18px;
    animation: fadeIn 0.8s ease-out 0.2s both;
  }
  .tagline {
    color: #a8c4f8;
    font-size: 13px;
    letter-spacing: 1px;
    margin-top: 8px;
    animation: fadeIn 0.8s ease-out 0.4s both;
  }
  .spinner-container {
    margin-top: 38px;
    animation: fadeIn 0.8s ease-out 0.6s both;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 2px solid rgba(168, 196, 248, 0.18);
    border-top-color: #a8c4f8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .status {
    color: rgba(168, 196, 248, 0.65);
    font-size: 12px;
    margin-top: 16px;
    animation: fadeIn 0.8s ease-out 0.8s both;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body data-tauri-drag-region>
  <img class="logo" src="splash-logo.png" width="180" height="180" alt="WriTea Draft">
  <div class="app-name">WriTea Draft</div>
  <div class="tagline">Professional Screenwriting</div>
  <div class="spinner-container"><div class="spinner"></div></div>
  <div class="status">Starting up...</div>
</body>
</html>
